[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
[profile.release]
opt-level = "s"
lto = true

# Offline exhaustive reading export: speed matters more than binary size.
[profile.export]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
